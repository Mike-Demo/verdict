# Hono spike config — deploys as a SEPARATE worker (verdict-hono).
# The production worker (verdict) is untouched. No queue consumer is attached
# here, so this worker can never steal eval messages from production.
# NOTE: ACCOUNT_HOST below is the real host for deploys; the copy pushed to
# GitHub must use the YOUR_ACCOUNT_ID placeholder (sanitized at push time).
name = "verdict-hono"
main = "src/index.ts"
compatibility_date = "2026-10-11"

[vars]
BASE_REPO = "sample"
NAMESPACE = "verdict-prototype"
# Replace with your Artifacts host: <account-id>.artifacts.cloudflare.net
ACCOUNT_HOST = "YOUR_ACCOUNT_ID.artifacts.cloudflare.net"
WORKER_URL = "https://verdict-hono.hey-demo-827.workers.dev"

[ai]
binding = "AI"

[[artifacts]]
binding = "ARTIFACTS"
namespace = "verdict-prototype"

[[d1_databases]]
binding = "DB"
database_name = "verdict-db"
database_id = "c96f502f-76c1-4aea-bdbf-7eab306f1cb2"

[[queues.producers]]
binding = "EVAL_QUEUE"
queue = "verdict-eval-q"

[[durable_objects.bindings]]
name = "SANDBOX"
class_name = "Sandbox"

[[containers]]
class_name = "Sandbox"
image = "docker.io/cloudflare/sandbox:0.9.4"
instance_type = "standard-1"
max_instances = 10

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]
